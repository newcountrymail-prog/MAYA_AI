name: Android APK Build & Release Automation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace --continue || true

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and Stage Generated APKs
        id: locate_apks
        run: |
          mkdir -p build_output/apk
          echo "Scanning build outputs for APK files..."
          find . -type f -name "*.apk" -not -path "*/build-cache/*" | while read -r apk_path; do
            echo "Discovered APK: $apk_path"
            cp "$apk_path" build_output/apk/
          done
          
          APK_COUNT=$(ls -1 build_output/apk/*.apk 2>/dev/null | wc -l)
          echo "Total APKs found: $APK_COUNT"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK files generated!"
            exit 1
          fi
          echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-ai-debug-apk
          path: build_output/apk/*.apk
          retention-days: 14

      - name: Upload Build Reports & Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Preserve Build Failure Diagnostic Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-logs
          path: |
            **/*.log
            **/build/reports/problems/
          retention-days: 7

  release:
    name: Publish Release APK
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Staged APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maya-ai-debug-apk
          path: release_apks

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
